[build-system]
# PEP 639 SPDX license metadata (a license string plus a list-form
# license-files) needs hatchling 1.27; 1.25/1.26 fail the build.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tabpfn-graph"
version = "0.2.0"
description = "Stable graph-to-table features for TabPFN and scikit-learn estimators"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "tabpfn-graph contributors"}]
keywords = ["graphs", "tabpfn", "scikit-learn", "networkx"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.3",
  # WL subtree hashes for unlabeled graphs changed in 3.5; older releases
  # would silently invalidate a fitted WL vocabulary.
  "networkx>=3.5",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.10",
  "tabpfn>=2.0",
]

[project.urls]
Homepage = "https://github.com/m-herre/tabpfn-graph"
Repository = "https://github.com/m-herre/tabpfn-graph"
Issues = "https://github.com/m-herre/tabpfn-graph/issues"
Changelog = "https://github.com/m-herre/tabpfn-graph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fast = ["networkit>=11"]
client = ["tabpfn-client>=0.1"]
dev = [
  "build>=1.2",
  "hatch>=1.12",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.7",
  "pandas-stubs>=2.0",
  "types-networkx>=3.5",
  "twine>=5",
]
bench = ["catboost>=1.2", "ogb>=1.3", "torch-geometric>=2.5", "xgboost>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/tabpfn_graph"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/docs",
  "/src",
  "/tests",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["gpu: opt-in test requiring TabPFN model access and a GPU"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["networkit.*", "networkx", "networkx.*", "tabpfn.*"]
ignore_missing_imports = true

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: pytest -m 'not gpu'
      - run: ruff check src tests benchmarks
      - run: python -m build
      - run: python -m twine check dist/*

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m venv /tmp/tabpfn-graph-smoke
      - run: /tmp/tabpfn-graph-smoke/bin/pip install dist/*.whl
      - run: /tmp/tabpfn-graph-smoke/bin/python -c 'from tabpfn_graph import GraphClassifier, GraphFeatureExtractor, GraphRegressor'

